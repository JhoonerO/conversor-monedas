<style>
/* Layout: tienda en una columna centrada (máx. 1120px); panel = barra lateral de secciones + área de trabajo */
:root{
  --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#E9EBF2; --ink:#141725; --muted:#5B6176; --line:#DADDE7;
  --accent:#2E47E6; --accent-ink:#FFFFFF; --wa:#16964A; --wa-ink:#FFFFFF;
  --warn:#A86400; --bad:#C62F2F; --good:#0F7A45;
  --display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --body:'DM Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F17; --surface:#161924; --surface-2:#1F2331; --ink:#ECEEF6; --muted:#9BA1B6; --line:#2A2F41;
  --accent:#7186FF; --accent-ink:#0D0F17; --wa:#2DC76A; --wa-ink:#06210F;
  --warn:#F2A93B; --bad:#FF6F6F; --good:#3DD08A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D0F17; --surface:#161924; --surface-2:#1F2331; --ink:#ECEEF6; --muted:#9BA1B6; --line:#2A2F41;
  --accent:#7186FF; --accent-ink:#0D0F17; --wa:#2DC76A; --wa-ink:#06210F;
  --warn:#F2A93B; --bad:#FF6F6F; --good:#3DD08A; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin-inline:auto}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);margin-inline:-16px;padding:10px 16px;border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand-logo{width:32px;height:32px;display:block;flex:none}
.demo-tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.seg{display:flex;background:var(--surface-2);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px}
.themebtn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.themebtn .i-sun{display:none}
.dark-on .themebtn .i-sun{display:block}
.dark-on .themebtn .i-moon{display:none}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-grid;place-items:center}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.wa{background:var(--wa);color:var(--wa-ink);border-color:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.ghost{background:none}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.wa-ico{width:16px;height:16px;flex:none}

/* ---------- TIENDA ---------- */
.hero{padding-block:40px 28px;display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end}
.hero h1{font-size:clamp(34px,6vw,58px);font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero .lead{color:var(--muted);font-size:17px;margin-top:12px;max-width:46ch}
.trust{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.trust li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.trust b{display:block}
.trust span{color:var(--muted)}
.trust svg{flex:none;margin-top:2px;color:var(--good)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-block:8px 20px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;cursor:pointer;font-weight:500}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-block:28px 14px}
.sec-title h2{font-size:24px;letter-spacing:-.02em}
.sec-title span{color:var(--muted);font-size:14px}

.combos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.combo{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.combo.feat{border:2px solid var(--accent)}
.ribbon{position:absolute;top:-11px;right:16px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px}
.combo h3{font-size:22px;letter-spacing:-.02em}
.combo .inc{color:var(--muted);font-size:14px}
.monos{display:flex}
.monos .mono{margin-right:-6px;box-shadow:0 0 0 3px var(--surface)}
.mono{width:40px;height:40px;border-radius:11px;background:hsl(var(--h) 62% 42%);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:-.02em;flex:none}
.mono.br{background:var(--pb);color:var(--pf);border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.poster{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;display:grid;place-items:center;text-align:center;background:var(--pb);color:var(--pf);font-family:var(--pff,var(--display));font-weight:800;font-size:var(--pfs,26px);letter-spacing:var(--pls,-.02em);line-height:1;padding:0 10px;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden}
.poster:not(.img):not(.haslg)::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 85% 0%,rgb(255 255 255 / .16),transparent 55%),linear-gradient(to top,rgb(0 0 0 / .28),transparent 45%);pointer-events:none}
.poster .tag{position:absolute;left:8px;top:8px;font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:rgb(0 0 0 / .45);padding:4px 7px;border-radius:6px}
.poster.img{padding:0;background:var(--surface-2)}
.ccov{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}
.ccov span{display:grid;place-items:center;background:var(--pb);color:var(--pf);font-family:var(--pff,var(--display));font-weight:800;font-size:22px;letter-spacing:-.02em}
.thumb{width:96px;aspect-ratio:16/9;border-radius:8px;overflow:hidden;flex:none;border:1px solid var(--line);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .poster,.thumb .ccov{border:0;border-radius:0;font-size:12px;padding:0 4px}
.thumb .ccov span{font-size:10px}
.thumb .tag{display:none}
.poster.img img{width:100%;height:100%;object-fit:cover}
.poster img.lg,.ccov span img.lg{position:absolute;inset:0;margin:auto;max-width:72%;max-height:44%;object-fit:contain}
.ccov span{position:relative}
.ccov span img.lg{max-width:78%;max-height:40%}
img.lg.inv{filter:invert(1)}
.mono.img{background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.mono.img img{width:100%;height:100%;object-fit:cover;display:block}
.card .mono{width:52px;height:52px;border-radius:14px;font-size:17px}
.combo .mono{width:48px;height:48px;border-radius:13px}
.imgbtn{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.imgbtn input{position:absolute;width:1px;height:1px;opacity:0}
.price{display:flex;align-items:baseline;gap:6px;margin-top:auto}
.price strong{font-family:var(--display);font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:14px}
.save{font-size:13px;font-weight:500;color:var(--good)}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card .head{display:flex;gap:12px;align-items:center}
.card h3{font-size:18px;letter-spacing:-.01em}
.card .desc{color:var(--muted);font-size:13px}
.card .price strong{font-size:24px}
.pwrap{position:relative}
.card.out .poster,.card.out .ccov{filter:grayscale(.85) brightness(.8)}
.sold{position:absolute;top:10px;right:10px;background:var(--bad);color:#fff;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px}
.card .price strong.na{font-size:18px;color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.steps>div{display:flex;gap:12px}
.steps b.n{font-family:var(--mono);font-size:13px;color:var(--accent);padding-top:2px}
.steps h3{font-size:16px;font-family:var(--body);font-weight:700}
.steps p{color:var(--muted);font-size:14px}

/* ---------- PANEL ---------- */
.panel{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;padding-top:24px}
.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:76px;align-self:start}
.side button{text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:500;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.side button:hover{background:var(--surface-2)}
.side button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .08)}
.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph h1{font-size:28px;letter-spacing:-.025em}
.ph p{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-size:28px;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.warn .v{color:var(--warn)} .kpi.accent .v{color:var(--accent)} .kpi.good .v{color:var(--good)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.box h2{font-size:17px;font-family:var(--body);font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h2 small{font-weight:400;color:var(--muted);font-size:13px}
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--body)}
.chart text.v{fill:var(--ink);font-weight:700}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .m{font-size:13px;color:var(--muted)}
.li .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.chip.accent{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.chip.muted{color:var(--muted);background:var(--surface-2)}
.code{font-family:var(--mono);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .m{font-size:13px;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:180px}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=tel],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
td input[type=text],td input[type=number]{padding:6px 8px;border-radius:8px}
td input[type=number]{max-width:110px;text-align:right}
td input.days{max-width:70px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{color:var(--muted);padding:18px 0;text-align:center}
.rpbar{display:flex;flex-direction:column;gap:10px}
.rpdates{display:flex;gap:10px;flex-wrap:wrap}
.rpdates label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.rpdates input{width:170px}
.dl{font-size:12px;font-weight:700;color:var(--muted)}
.dl.up{color:var(--good)} .dl.down{color:var(--bad)}
.lgd{display:inline-flex;align-items:center;gap:5px;margin-left:10px}
.lgd i{width:10px;height:10px;border-radius:3px;background:var(--accent);display:inline-block}
.bar{width:100%;max-width:260px;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.li>.r{text-align:right;flex:none}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.tw.flat{border:0;border-radius:0;background:none}
.tw.scroll{max-height:420px;overflow-y:auto}
.form{display:grid;gap:12px}
.form label{display:grid;gap:5px;font-size:13px;font-weight:500;color:var(--muted)}
.form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{font-size:13px;color:var(--muted)}
.banner{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:12px;padding:10px 14px;font-size:14px}

/* modal */
.ov{position:fixed;inset:0;background:rgb(8 10 18 / .55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgb(0 0 0 / .3)}
.modal h3{font-size:22px;letter-spacing:-.02em}
.modal .sum{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--bad);font-size:13px}
.slines{display:grid;gap:10px}
.sline{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--surface-2)}
.sline input,.sline select{background:var(--surface)}
.slh{display:flex;justify-content:space-between;align-items:center;min-height:28px;color:var(--ink)}
.stot{display:grid;gap:4px;background:var(--surface-2);border-radius:12px;padding:12px 14px}
.stot>div:not(.note){display:flex;justify-content:space-between;gap:12px}
.stot span{color:var(--muted)}
.rnall{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer}
.rnlist{display:flex;flex-direction:column}
.rn{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rn:first-child{border-top:0}
.rn .grow{flex:1;min-width:0}
.rn .t{font-weight:500;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rn .m{font-size:13px;color:var(--muted)}
.rn input[type=number]{width:110px;flex:none}
.rn input[type=checkbox],.rnall input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.btn.off{opacity:.45;pointer-events:none}
.promo{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:#141414;color:#fff;border-radius:20px;overflow:hidden;margin-top:36px;border:1px solid #2a2a2a}
.promo-txt{padding:28px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;justify-content:center}
.promo-logo{width:88px;height:auto}
.promo-k{color:#FFC72C;font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.promo h2{font-size:28px;letter-spacing:-.02em;color:#fff;line-height:1.1}
.promo p{color:#cfcfcf;max-width:46ch}
.promo p b{color:#fff}

/* ---------- TIENDA "TAQUILLA": cartelera de cine, boletas y un solo color de acción ---------- */
body.tq{
  --bg:#F4EFE6; --surface:#FFFDF8; --surface-2:#ECE5D7; --ink:#17141F; --muted:#665F53; --line:#DCD2C0;
  --accent:#4F3BF2; --accent-ink:#FFFFFF; --accent-hov:#3F2CD9; --gold:#9A6B1F; --stub:#F7F1E4;
  --wa:#128C4A; --wa-ink:#FFFFFF; --good:#0F7A45; --bad:#C62F2F;
  --marquee:'Bebas Neue',var(--display);
  background:var(--bg);color-scheme:light}
body.tq.dark-on{
  --bg:#0B0A0F; --surface:#15131B; --surface-2:#1F1C27; --ink:#F3EEE4; --muted:#A49E92; --line:#2C2836;
  --accent:#7B6CFF; --accent-ink:#0B0A0F; --accent-hov:#9487FF; --gold:#D9B25F; --stub:#1A1722;

.mq{position:relative;overflow:hidden;margin:6px -16px 26px;padding:14px 0;border-block:1px solid var(--line);background:var(--surface);
  -webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}

/* filtros y títulos */

body.tq .sec-title span{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}

/* cada producto es una boleta: póster arriba, perforación, talón con precio */
body.tq .card,body.tq .combo{background:var(--surface);border:1px solid var(--line);border-radius:14px;transition:transform .2s ease-out,box-shadow .2s ease-out}
body.tq .card:hover,body.tq .combo:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px rgb(0 0 0 / .35)}
.perf{position:relative;height:0;border-top:2px dashed color-mix(in srgb,var(--muted) 45%,transparent);margin:2px -16px}
.combo .perf{margin-inline:-20px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-10px;clip-path:inset(0 0 0 50%)}
.perf::after{right:-10px;clip-path:inset(0 50% 0 0)}

body.tq .card .btn.block,body.tq .combo .btn.block,body.tq .btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:700;min-height:44px}
body.tq .card .btn.block:hover,body.tq .combo .btn.block:hover,body.tq .btn.primary:hover{background:var(--accent-hov)}
body.tq .card .btn.block:active,body.tq .combo .btn.block:active{transform:scale(.98)}

}

}

<script>
const KEY='cuentasya-demo-v2';
const DAY=86400000;
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(n).toLocaleString('es-CO');
const short=n=>Math.abs(n)>=1e6?'$'+(n/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M':'$'+Math.round(n/1000)+' mil';
const uid=()=>Math.random().toString(36).slice(2,9);
const digits=s=>String(s||'').replace(/\D/g,'');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const daysLeft=s=>Math.round((parse(s)-today())/DAY);
const fdate=s=>parse(s).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);if(m<1)return'ahora';if(m<60)return`hace ${m} min`;const h=Math.round(m/60);if(h<24)return`hace ${h} h`;return`hace ${Math.round(h/24)} d`};
const waLink=(phone,msg)=>`https://wa.me/${digits(phone)}?text=${encodeURIComponent(msg)}`;
const WA_SVG='<svg class="wa-ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>';

let S, view='tienda', tab='resumen', storeFilter='todo', subFilter='todas', subQ='', cliQ='', ordFilter='pendiente', rp='7d', rpFrom='', rpTo='';

/* ---------- datos de ejemplo ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- catálogo real: proveedores y lo que cobra cada uno (costo / precio final) ---------- */
function catalog(){
  const products=[
    ['nf','Netflix','N','video','1 pantalla · perfil propio',355],
    ['dp','Disney+','D+','video','1 pantalla · perfil propio',222],
    ['mx','HBO Max','M','video','1 pantalla · perfil propio',262],
    ['pv','Prime Video','PV','video','1 pantalla · perfil propio',196],
    ['pp','Paramount+','P+','video','1 pantalla · perfil propio',212],
    ['cr','Crunchyroll','CR','video','Anime sin anuncios · 1 perfil',24],
    ['px','Plex','PX','video','Películas y series · 1 perfil',40],
    ['nu','Nuplin','NU','video','1 pantalla · perfil propio',300],
    ['yt','YouTube Premium','YT','musica','Sin anuncios + YouTube Music',2],
    ['sp','Spotify','S','musica','Sin proveedor por ahora',142],
    ['gp','ChatGPT','GPT','apps','Cuenta Plus',160],
    ['cc','CapCut','CC','apps','CapCut Pro',0],
  ].map(([id,name,mono,cat,desc,h])=>({id,name,mono,cat,desc,h,price:0,cost:0,days:30,active:false,type:'single',providerId:null}));
  const providers=[
    {id:'edgar',name:'Edgar',phone:''},{id:'lina',name:'Lina',phone:''},
    {id:'ricardo',name:'Ricardo',phone:''},{id:'alex',name:'Alex',phone:''},
  ];
  const k=1000, offers=[
  ].map(([providerId,productId,cost,price])=>({id:providerId+'-'+productId,providerId,productId,cost:cost==null?null:cost*k,price:price==null?null:price*k}));
  // cada plataforma arranca con el proveedor más barato; sin precio confirmado queda oculta
  products.forEach(p=>{const best=offers.filter(o=>o.productId===p.id&&o.cost!=null).sort((x,y)=>x.cost-y.cost)[0];
    p.active=true;if(best){p.providerId=best.providerId;p.cost=best.cost;p.price=best.price;p.stock='ok'}else p.stock='agotado'});
  const P=id=>products.find(p=>p.id===id);

const RP=[['hoy','Hoy'],['ayer','Ayer'],['7d','7 días'],['30d','30 días'],['mes','Este mes'],['mesant','Mes pasado'],['anio','Este año'],['todo','Todo'],['custom','Personalizado']];
const nDays=(a,b)=>Math.round((parse(b)-parse(a))/DAY)+1;
function rpRange(){const t=iso(today()),m1=t.slice(0,8)+'01';
  if(rp==='hoy')return[t,t];
  if(rp==='ayer'){const y=addDays(t,-1);return[y,y]}
  if(rp==='7d')return[addDays(t,-6),t];
  if(rp==='30d')return[addDays(t,-29),t];
  if(rp==='mes')return[m1,t];
  if(rp==='mesant'){const e=addDays(m1,-1);return[e.slice(0,8)+'01',e]}
  if(rp==='anio')return[t.slice(0,4)+'-01-01',t];
  if(rp==='todo'){const f=S.sales.reduce((m,s)=>s.date<m?s.date:m,t);return[f,t]}
  let a=rpFrom||addDays(t,-6),b=rpTo||t;if(a>b)[a,b]=[b,a];return[a,b]}
// período con el que se compara: meses y años contra el mismo tramo del mes/año anterior
const shiftMonths=(d,n)=>{const x=parse(d),day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return iso(x)};
function rpPrev(a,b){
  if(rp==='todo')return null;
  if(rp==='mes')return[shiftMonths(a,-1),shiftMonths(b,-1)];
  if(rp==='mesant'){const e=addDays(a,-1);return[e.slice(0,8)+'01',e]}
  if(rp==='anio')return[shiftMonths(a,-12),shiftMonths(b,-12)];
  const len=nDays(a,b);return[addDays(a,-len),addDays(a,-1)]}
const ordDay=o=>iso(new Date(o.date));
function rpStats(a,b){const ss=S.sales.filter(s=>s.date>=a&&s.date<=b),os=S.orders.filter(o=>{const d=ordDay(o);return d>=a&&d<=b});
  const ing=ss.reduce((x,s)=>x+s.price,0),cost=ss.reduce((x,s)=>x+s.cost,0);
  return{ss,os,ing,cost,g:ing-cost,n:ss.length,tk:ss.length?ing/ss.length:0,mg:ing?(ing-cost)/ing*100:0,
    ren:ss.filter(s=>s.kind==='renovación').length,conf:os.filter(o=>o.status==='confirmado').length,canc:os.filter(o=>o.status==='cancelado').length}}
const delta=(a,b,inv)=>{if(b==null)return'';if(!b)return a?'<span class="dl up">nuevo</span>':'<span class="dl">igual</span>';
  const p=Math.round((a-b)/Math.abs(b)*100);if(!p)return'<span class="dl">igual</span>';const good=inv?p<0:p>0;return`<span class="dl ${good?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span>`};
const fdl=s=>parse(s).toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'});
function reportes(){
  const[a,b]=rpRange(),len=nDays(a,b),cur=rpStats(a,b);

  // serie para la gráfica: por día hasta 62 días, si no por mes
  let pts=[];
  if(len>1&&len<=62){for(let i=0;i<len;i++){const d=addDays(a,i);const ss=cur.ss.filter(s=>s.date===d);pts.push({l:parse(d).toLocaleDateString('es-CO',{day:'numeric',month:'short'}).replace('.',''),ing:ss.reduce((x,s)=>x+s.price,0),g:ss.reduce((x,s)=>x+s.price-s.cost,0),n:ss.length})}}
  else if(len>62){const ks=[...new Set(Array.from({length:len},(_,i)=>addDays(a,i).slice(0,7)))];pts=ks.map(k=>{const ss=cur.ss.filter(s=>s.date.slice(0,7)===k);return{l:parse(k+'-01').toLocaleDateString('es-CO',{month:'short',year:'2-digit'}).replace('.',''),ing:ss.reduce((x,s)=>x+s.price,0),g:ss.reduce((x,s)=>x+s.price-s.cost,0),n:ss.length}})}
  let chart='';
  if(pts.length){const W=600,H=150,base=175,max=Math.max(...pts.map(p=>p.ing),1),slot=(W-40)/pts.length,bw=Math.max(3,Math.min(46,slot*.7)),every=Math.ceil(pts.length/10);

    chart=`<div class="box chart"><h2>${len>62?'Por mes':'Por día'} <small><span class="lgd"><i></i>Ganancia</span> <span class="lgd"><i style="opacity:.28"></i>Ingresos</span></small></h2>
      <svg viewBox="0 0 600 200" role="img" aria-label="Ingresos y ganancia ${len>62?'por mes':'por día'}"><line x1="20" x2="590" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}</svg></div>`}
  // agrupaciones
  const group=(key)=>{const m={};cur.ss.forEach(s=>{const k=key(s)||'—';m[k]=m[k]||{n:0,ing:0,cost:0};m[k].n++;m[k].ing+=s.price;m[k].cost+=s.cost});return Object.entries(m).sort((x,y)=>(y[1].ing-y[1].cost)-(x[1].ing-x[1].cost))};
  const share=v=>cur.g>0?Math.max(0,Math.round(v/cur.g*100)):0;
  const byP=group(s=>s.productId),byC=group(s=>s.clientId),byV=group(s=>s.providerId);
  const rowsP=byP.map(([id,v])=>{const p=prod(id),g=v.ing-v.cost;return`<div class="li">${p.type==='combo'?monoOf({...p,mono:'C',h:230}):monoOf(p)}<div class="grow"><div class="t">${esc(p.name)}</div><div class="m num">${v.n} venta${v.n===1?'':'s'} · ingresos ${fmt(v.ing)} · costo ${fmt(v.cost)}</div><div class="bar"><i style="width:${share(g)}%"></i></div></div><div class="r"><b class="num">${fmt(g)}</b><div class="m num">${share(g)}% del total</div></div></div>`}).join('');
  const rowsC=byC.slice(0,10).map(([id,v])=>{const c=client(id);return`<div class="li"><div class="grow"><div class="t">${esc(c.name)}</div><div class="m num">${v.n} compra${v.n===1?'':'s'} · ${fmt(v.ing)}</div></div><b class="num">${fmt(v.ing-v.cost)}</b></div>`}).join('');
  const rowsV=byV.map(([id,v])=>`<div class="li"><div class="grow"><div class="t">${id==='—'?'Sin proveedor':esc(provName(id))}</div><div class="m num">${v.n} venta${v.n===1?'':'s'} · le pagaste ${fmt(v.cost)}</div></div><b class="num">${fmt(v.ing-v.cost)}</b></div>`).join('');
  const det=[...cur.ss].sort((x,y)=>y.date.localeCompare(x.date));
  const rowsD=det.map(s=>{const p=prod(s.productId),c=client(s.clientId);return`<tr><td>${fdate(s.date)}</td><td>${esc(c.name)}</td><td>${esc(p.name)}</td><td><span class="chip ${s.kind==='renovación'?'accent':'good'}">${s.kind==='renovación'?'Renovación':'Nueva'}</span></td><td class="r num">${fmt(s.price)}</td><td class="r num">${fmt(s.cost)}</td><td class="r num"><b>${fmt(s.price-s.cost)}</b></td><td class="r"><button class="btn sm" data-act="editsale" data-id="${s.id}">Editar</button></td></tr>`}).join('');
  const conv=cur.os.length?Math.round(cur.conf/cur.os.length*100):0;
  const vs=prev?`vs. ${pa===pb?fdl(pa):`${fdl(pa)} – ${fdl(pb)}`}`:'';
  return`
  <div class="ph"><div><h1>Reportes</h1><p>${esc(label)}${vs?` <span class="m">· comparado con ${esc(vs.slice(4))}</span>`:''}</p></div>
    <button class="btn" data-act="rpcsv"${cur.n?'':' disabled'}>Descargar Excel (CSV)</button></div>
  <div class="rpbar"><div class="pills">${pills}</div>
    ${rp==='custom'?`<div class="rpdates"><label>Desde<input type="date" id="rpFrom" value="${a}" max="${iso(today())}"></label><label>Hasta<input type="date" id="rpTo" value="${b}" max="${iso(today())}"></label></div>`:''}</div>
  <div class="kpis">

function rpCsv(){const[a,b]=rpRange(),{ss}=rpStats(a,b);

    return{c,total:ss.reduce((a,s)=>a+s.price,0),gan:ss.reduce((a,s)=>a+s.price-s.cost,0),last:ss.map(s=>s.date).sort().pop(),act}}).sort((a,b)=>b.total-a.total);

    <td class="r num">${fmt(total)}</td><td class="r num">${fmt(gan)}</td><td class="num">${last?fdate(last):'—'}</td>
    <td class="r"><div class="toolbar" style="justify-content:flex-end">${S.subs.some(s=>s.clientId===c.id)?`<button class="btn sm" data-act="renewc" data-id="${c.id}">Renovar</button>`:''}${c.phone?`<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/${digits(c.phone)}">${WA_SVG} Chat</a>`:''}</div></td></tr>`).join('')}

function productos(){return`

  ${S.products.map(p=>`<tr data-pid="${p.id}">

      <div class="imgbtn"><label class="btn sm ghost" for="pk-${p.id}">${p.cover?'Cambiar portada':'Subir portada'}<input type="file" id="pk-${p.id}" accept="image/*" data-cover="${p.id}"></label>${p.cover?`<button class="btn sm ghost danger" data-act="rmcover" data-id="${p.id}">Quitar portada</button>`:''}<label class="btn sm ghost" for="pi-${p.id}">${p.img?'Cambiar logo':'Subir logo'}<input type="file" id="pi-${p.id}" accept="image/*" data-img="${p.id}"></label>${p.img?`<button class="btn sm ghost danger" data-act="rmimg" data-id="${p.id}">Quitar logo</button>`:''}</div></div><div class="thumb">${p.cover?`<img src="${p.cover}" alt="">`:posterOf(p)}</div></div></td>
    <td>${provCell(p)}</td>

function provCell(p){if(p.type==='combo')return'<span class="m">Varios</span>';const os=offersOf(p.id).filter(o=>o.cost!=null);

function gainCell(p){const g=p.price-p.cost,m=p.price?Math.round(g/p.price*100):0;return`<b style="color:${g<0?'var(--bad)':'var(--good)'}">${fmt(g)}</b><div class="m">${m}% margen</div>`}

  const cmp=prods.map(p=>{const os=offersOf(p.id),priced=os.filter(o=>o.cost!=null),min=priced.length?Math.min(...priced.map(o=>o.cost)):null;

    <div class="tw"><table style="min-width:520px"><thead><tr><th>Producto</th><th class="r">Te cuesta</th><th class="r">Lo vendes a</th><th class="r">Ganancia</th><th class="r"></th></tr></thead><tbody>
    ${os.map(o=>{const p=prod(o.productId),g=o.cost!=null&&o.price!=null?o.price-o.cost:null;return`<tr data-oid="${o.id}">
      <td>${esc(p.name)}${p.providerId===v.id?' <span class="chip accent">En uso</span>':''}</td>
      <td class="r"><input type="number" id="oc-${o.id}" data-of="cost" value="${o.cost??''}" placeholder="Por confirmar" step="500" min="0" aria-label="Costo de ${esc(p.name)} con ${esc(v.name)}"></td>
      <td class="r"><input type="number" id="op-${o.id}" data-of="price" value="${o.price??''}" placeholder="—" step="500" min="0" aria-label="Precio de ${esc(p.name)} con ${esc(v.name)}"></td>
      <td class="r num" data-ogain>${g==null?'<span class="m">—</span>':`<b style="color:${g<0?'var(--bad)':'var(--good)'}">${fmt(g)}</b>`}</td>
      <td class="r"><button class="btn sm ghost danger" data-act="rmoffer" data-id="${o.id}" aria-label="Quitar ${esc(p.name)} de ${esc(v.name)}">Quitar</button></td></tr>`}).join('')}
    </tbody></table></div>
    ${avail.length?`<div class="toolbar" style="margin-top:10px"><select id="va-${v.id}" aria-label="Producto para agregar a ${esc(v.name)}" style="max-width:240px">${avail.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><button class="btn sm" data-act="addoffer" data-id="${v.id}">+ Agregar a ${esc(v.name)}</button></div>`:''}

/* ---------- ventas ---------- */
function findOrCreateClient(name,phone){
  phone=digits(phone);if(phone.length===10)phone='57'+phone;
  let c=phone?S.clients.find(c=>digits(c.phone)===phone):null;
  if(!c)c=S.clients.find(c=>c.name.toLowerCase()===name.toLowerCase());
  if(!c){c={id:uid(),name,phone};S.clients.push(c)}else if(phone&&!c.phone)c.phone=phone;
  return c;
}
function registerSale({clientId,productId,providerId,cost,account,start,price}){
  const p=prod(productId);
  const sub={id:uid(),clientId,productId,start,end:addDays(start,p.days),account,providerId:providerId??p.providerId??null};
  S.subs.push(sub);
  S.sales.push({id:uid(),date:iso(today()),productId,clientId,price:Number(price)||p.price,cost:cost??p.cost,providerId:sub.providerId,kind:'nueva'});
  return sub;
}
/* una venta puede llevar varios productos: cada línea es producto + proveedor + precio + cuenta entregada */
function defOffer(pid){const p=prod(pid),os=offersOf(pid).filter(o=>o.cost!=null);return(os.find(o=>o.providerId===p.providerId)||os[0]||{}).id||''}
const newLine=pid=>({productId:pid,offerId:defOffer(pid),price:prod(pid).price,account:''});
const lineCost=l=>{const o=S.offers.find(x=>x.id===l.offerId);return o?o.cost:prod(l.productId).cost};
function lineHtml(l,i,n){
  const opts=S.products.map(p=>`<option value="${p.id}" ${p.id===l.productId?'selected':''}>${esc(p.name)} — ${fmt(p.price)}${p.active?'':' (oculto)'}</option>`).join('');
  const os=offersOf(l.productId).filter(o=>o.cost!=null);
  const prov=os.length?os.map(o=>`<option value="${o.id}" ${o.id===l.offerId?'selected':''}>${esc(provName(o.providerId))} · costo ${fmt(o.cost)}</option>`).join(''):'<option value="">Sin proveedor</option>';
  return`<div class="sline" data-i="${i}">
    <div class="slh"><b>Producto${n>1?' '+(i+1):''}</b>${n>1?`<button type="button" class="btn ghost sm danger" data-rm="${i}">Quitar</button>`:''}</div>
    <label>Producto<select data-k="productId">${opts}</select></label>
    <div class="row2"><label>Proveedor<select data-k="offerId">${prov}</select></label>
    <label>Precio cobrado<input type="number" step="500" min="0" data-k="price" value="${l.price}"></label></div>
    <label>Cuenta entregada (correo, perfil, PIN)<input type="text" data-k="account" value="${esc(l.account)}" placeholder="Ej: Cuenta 07 · Perfil 3 · PIN 4821"></label>
  </div>`}
function openSale(oid){
  const o=oid?S.orders.find(x=>x.id===oid):null;if(oid&&!o)return;
  const first=o?o.productId:(S.products.find(p=>p.active&&p.type!=='combo')||S.products[0]).id;
  const L=[newLine(first)];
  const cliSel=o?'':`<label for="sfCli">Cliente<select id="sfCli"><option value="">— Cliente nuevo —</option>${S.clients.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(c=>`<option value="${c.id}">${esc(c.name)}${c.phone?' · +'+esc(c.phone):''}</option>`).join('')}</select></label>`;
  modal(`<h3>${o?`Confirmar pedido <span class="code">${esc(o.code)}</span>`:'Registrar venta'}</h3>
    <p class="note">${o?`Pidió <b>${esc(prod(o.productId).name)}</b> desde la tienda ${ago(o.date)}. Si al final compró otra cosa, cámbialo; si llevó más, añádelo. Se crea su suscripción y la venta entra en tus reportes.`:'Para ventas que llegaron directo por WhatsApp, sin pasar por la tienda.'}</p>
    <div class="form">${cliSel}
      <div class="row2" id="sfNew"><label for="sfName">Nombre del cliente<input type="text" id="sfName" value="${esc(o?o.name:'')}"></label>
      <label for="sfPhone">WhatsApp<input type="tel" id="sfPhone" value="${esc(o?o.phone:'')}" placeholder="300 123 4567"></label></div>
      <div id="sfLines" class="slines"></div>
      <button type="button" class="btn sm" id="sfAdd">+ Añadir otro producto</button>
      <label for="sfStart">Empieza<input type="date" id="sfStart" value="${iso(today())}"></label>
      <div class="stot" id="sfTot"></div>
      <p class="err" id="sfErr" hidden></p>
    </div>
    <div class="acts"><button class="btn" data-act="close">Volver</button><button class="btn primary" id="doSale">${o?'Confirmar venta':'Guardar venta'}</button></div>`);
  const box=$('#sfLines');
  const tot=()=>{const st=$('#sfStart').value||iso(today()),ing=L.reduce((a,l)=>a+(Number(l.price)||0),0),g=L.reduce((a,l)=>a+(Number(l.price)||0)-lineCost(l),0);
    $('#sfTot').innerHTML=`<div><span>Total cobrado</span><b class="num">${fmt(ing)}</b></div><div><span>Tu ganancia</span><b class="num" style="color:${g<0?'var(--bad)':'var(--good)'}">${fmt(g)}</b></div><div class="note">${L.map(l=>`${esc(prod(l.productId).name)} vence el ${fdate(addDays(st,prod(l.productId).days))}`).join(' · ')}</div>`};
  const paint=()=>{box.innerHTML=L.map((l,i)=>lineHtml(l,i,L.length)).join('');tot()};
  box.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k||k==='offerId')return;const i=+e.target.closest('.sline').dataset.i;
    if(k==='productId'){L[i]=newLine(e.target.value);paint();return}
    L[i][k]=k==='price'?Math.max(0,Number(e.target.value)||0):e.target.value;tot()});
  box.addEventListener('change',e=>{if(e.target.dataset.k!=='offerId')return;const i=+e.target.closest('.sline').dataset.i;L[i].offerId=e.target.value;
    const of=S.offers.find(x=>x.id===e.target.value);if(of&&of.price!=null){L[i].price=of.price;paint()}else tot()});
  box.addEventListener('click',e=>{const r=e.target.closest('[data-rm]');if(r){L.splice(+r.dataset.rm,1);paint()}});
  $('#sfAdd').onclick=()=>{L.push(newLine(L[L.length-1].productId));paint();box.lastElementChild.querySelector('select').focus()};
  $('#sfStart').addEventListener('input',tot);
  const cli=$('#sfCli');if(cli)cli.addEventListener('change',()=>{$('#sfNew').hidden=!!cli.value});
  paint();
  $('#doSale').onclick=()=>{const err=$('#sfErr');err.hidden=true;
    let clientId=cli&&cli.value;const name=$('#sfName').value.trim();
    if(!clientId&&!name){err.textContent='Escribe el nombre del cliente.';err.hidden=false;$('#sfName').focus();return}
    if(!L.length){err.textContent='Añade al menos un producto.';err.hidden=false;return}
    if(!clientId)clientId=findOrCreateClient(name,$('#sfPhone').value).id;
    const start=$('#sfStart').value||iso(today());
    L.forEach(l=>{const of=S.offers.find(x=>x.id===l.offerId);registerSale({clientId,productId:l.productId,providerId:of?of.providerId:null,cost:lineCost(l),account:l.account.trim(),start,price:l.price})});
    if(o)o.status='confirmado';save();closeModal();
    toast(o?`Pedido ${o.code} confirmado · ${L.length} producto${L.length>1?'s':''}`:`Venta registrada · ${L.length} producto${L.length>1?'s':''}`);render()};
}

/* editar o borrar una venta ya registrada */
function openEditSale(id){
  const s=S.sales.find(x=>x.id===id);if(!s)return;let armed=false;
  modal(`<h3>Editar venta</h3><p class="note">${esc(client(s.clientId).name)} · registrada el ${fdl(s.date)}</p>
    <div class="form">
      <label>Producto<select id="esProd">${S.products.map(p=>`<option value="${p.id}" ${p.id===s.productId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
      <div class="row2"><label>Fecha<input type="date" id="esDate" value="${s.date}"></label>
      <label>Tipo<select id="esKind"><option value="nueva" ${s.kind!=='renovación'?'selected':''}>Nueva</option><option value="renovación" ${s.kind==='renovación'?'selected':''}>Renovación</option></select></label></div>
      <div class="row2"><label>Precio cobrado<input type="number" step="500" min="0" id="esPrice" value="${s.price}"></label>
      <label>Tu costo<input type="number" step="500" min="0" id="esCost" value="${s.cost}"></label></div>
      <p class="note" id="esInfo"></p>
    </div>
    <div class="acts"><button class="btn danger" id="esDel" style="margin-right:auto">Borrar venta</button><button class="btn" data-act="close">Volver</button><button class="btn primary" id="esSave">Guardar</button></div>`);
  const info=()=>{const g=(Number($('#esPrice').value)||0)-(Number($('#esCost').value)||0);$('#esInfo').innerHTML=`Ganancia: <b style="color:${g<0?'var(--bad)':'var(--good)'}">${fmt(g)}</b>`};
  ['#esPrice','#esCost'].forEach(x=>$(x).addEventListener('input',info));info();
  $('#esSave').onclick=()=>{s.productId=$('#esProd').value;s.date=$('#esDate').value||s.date;s.kind=$('#esKind').value;s.price=Math.max(0,Number($('#esPrice').value)||0);s.cost=Math.max(0,Number($('#esCost').value)||0);save();closeModal();toast('Venta actualizada');render()};
  $('#esDel').onclick=e=>{if(!armed){armed=true;e.target.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{armed=false;const b=$('#esDel');b&&(b.textContent='Borrar venta')},4000);return}
    S.sales=S.sales.filter(x=>x!==s);save();closeModal();toast('Venta borrada');render()};
}

/* renovar uno, varios o todos los servicios de un cliente */
function openRenew(clientId,onlySub){
  const c=client(clientId),subs=S.subs.filter(s=>s.clientId===clientId).sort((a,b)=>a.end.localeCompare(b.end));if(!subs.length)return;
  const w=S.settings.warnDays,sel=new Set(onlySub?[onlySub]:subs.filter(s=>daysLeft(s.end)<=w).map(s=>s.id));if(!sel.size)subs.forEach(s=>sel.add(s.id));
  const price={};subs.forEach(s=>price[s.id]=prod(s.productId).price);
  const newEnd=s=>addDays(daysLeft(s.end)<0?iso(today()):s.end,prod(s.productId).days);
  modal(`<h3>Renovar a ${esc(c.name.split(' ')[0])}</h3>
    <p class="note">Tiene ${subs.length} servicio${subs.length>1?'s':''}. Marca los que va a renovar; puedes cambiar el precio de cada uno.</p>
    ${subs.length>1?'<label class="rnall"><input type="checkbox" id="rnAll"> Seleccionar todos</label>':''}
    <div class="rnlist">${subs.map(s=>{const p=prod(s.productId),[k,l]=status(s.end);return`<div class="rn">
      <input type="checkbox" data-sid="${s.id}" ${sel.has(s.id)?'checked':''} aria-label="Renovar ${esc(p.name)}">
      <div class="grow"><div class="t">${esc(p.name)} <span class="chip ${k}">${l}</span></div><div class="m">${s.account?esc(s.account)+' · ':''}vence ${fdate(s.end)} → <b>${fdate(newEnd(s))}</b></div></div>
      <input type="number" step="500" min="0" data-pid="${s.id}" value="${price[s.id]}" aria-label="Precio de ${esc(p.name)}"></div>`}).join('')}</div>
    <div class="stot" id="rnTot"></div>

async function sync(){syncT=null;if(!dbSeller)return;if(syncing){syncAgain=true;return}syncing=true;
  try{const cur=dbTables();
    for(const k of [...ORDER,'settings']){const prev=snap[k]||new Map(),up=[];cur[k].forEach((js,id)=>{if(prev.get(id)!==js)up.push(JSON.parse(js))});
      if(up.length){const {error}=await DB.from(k).upsert(up);if(error)throw error}}
    for(const k of [...ORDER].reverse()){const prev=snap[k]||new Map(),gone=[...prev.keys()].filter(id=>!cur[k].has(id));
      if(gone.length){const {error}=await DB.from(k).delete().in('id',gone);if(error)throw error}}
    snap=cur}
  catch(e){console.error(e);toast('No se pudo guardar en la base de datos: '+(e.message||e))}
  finally{syncing=false;if(syncAgain){syncAgain=false;scheduleSync()}}}

const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches};
function paintTheme(){const d=isDark();document.body.classList.toggle('dark-on',d);$('#themeTxt').textContent=d?'Claro':'Oscuro';$('#themeBtn').setAttribute('aria-label',d?'Cambiar a modo claro':'Cambiar a modo oscuro')}
try{const t=localStorage.getItem(TKEY);if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#themeBtn').addEventListener('click',()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem(TKEY,t)}catch(e){}paintTheme()});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintTheme);
paintTheme();
if(DB)S=emptyState();else load();
// en el sitio público (Vercel) el panel queda escondido para los clientes; se abre con #panel una vez en tu dispositivo
const PUBLIC_SITE=document.documentElement.dataset.site==='public';
function seller(){if(DB)return dbSeller;if(!PUBLIC_SITE)return true;try{return localStorage.getItem('kmi-vendedor')==='1'}catch(e){return location.hash==='#panel'}}
function applySeller(){if(DB){document.querySelectorAll('.seller').forEach(el=>el.hidden=!dbSeller);document.querySelectorAll('.demo-tag').forEach(el=>el.hidden=true);if(!dbSeller&&location.hash!=='#panel')view='tienda';return}
  if(PUBLIC_SITE&&location.hash==='#panel'){try{localStorage.setItem('kmi-vendedor','1')}catch(e){}}
  if(PUBLIC_SITE&&location.hash==='#salir'){try{localStorage.removeItem('kmi-vendedor')}catch(e){}view='tienda'}
  document.querySelectorAll('.seller').forEach(el=>el.hidden=!seller());if(!seller())view='tienda'}
if(location.hash==='#panel')view='panel';
applySeller();
if(DB)document.querySelectorAll('.demo-tag').forEach(el=>el.hidden=true);
window.addEventListener('hashchange',()=>{const v=location.hash==='#panel'?'panel':'tienda';view=v;applySeller();render()});
render();
if(DB)dbStart();
</script>
</body>
</html>
